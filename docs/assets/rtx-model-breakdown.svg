    .zero-bar{stroke:#aaa7bb;stroke-width:4;stroke-dasharray:6 5}
  </style>
  <title id="models-title">Prix médians par modèle RTX</title>
  <desc id="models-desc">Comparaison des prix médians par modèle RTX, avec le nombre d'annonces détectées. Les modèles sont regroupés par générations 20xx, 30xx, 40xx et 50xx. RTX 3090 apparaît avec zéro annonce détectée.</desc>
  <rect width="1600" height="1100" fill="#101018"/>
  <text x="55" y="72" fill="#f5f3ff" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="600">RTX · prix médians par modèle</text>
  <text x="55" y="110" fill="#aaa7bb" font-family="Inter,Arial,sans-serif" font-size="20">203 annonces classées par modèle exact · 14 autres ou ambigus · collecte partielle</text>
