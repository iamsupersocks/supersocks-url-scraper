<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="models-title models-desc">
  <style>
    .panel-title,.model-bar{font-family:Inter,Arial,sans-serif;font-weight:600}
    .panel-20 .panel-title,.panel-20 .model-bar{fill:#6c8cff}
    .panel-30 .panel-title,.panel-30 .model-bar{fill:#9b7cff}
    .panel-40 .panel-title,.panel-40 .model-bar{fill:#ffb86c}
    .panel-50 .panel-title,.panel-50 .model-bar{fill:#ff7bbd}
    .model-label,.row-value{fill:#f5f3ff;font-family:Inter,Arial,sans-serif;font-size:17px}
    .panel-title{font-size:22px}
    .axis-label{fill:#aaa7bb;font-family:Inter,Arial,sans-serif;font-size:16px}
    .panel-rule{stroke:#302d42;stroke-width:1}
    .zero-bar{stroke:#aaa7bb;stroke-width:4;stroke-dasharray:6 5}
  </style>
  <title id="models-title">Prix médians par modèle RTX</title>
  <desc id="models-desc">Comparaison des prix médians GPU-only par modèle RTX (PC, portables, lots exclus). Générations 20xx–50xx. RTX 3090 est une ligne de contrôle.</desc>
  <rect width="1600" height="1100" fill="#101018"/>
  <text x="55" y="72" fill="#f5f3ff" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="600">RTX · prix médians par modèle</text>
  <text x="55" y="110" fill="#aaa7bb" font-family="Inter,Arial,sans-serif" font-size="18">704 annonces GPU classées · 137 autres/ambigus · hors PC/portable/lot · collecte partielle</text>
  <g font-family="Inter,Arial,sans-serif" font-size="18">
    <circle cx="1110" cy="70" r="8" fill="#6c8cff"/><text x="1128" y="76" fill="#d5d1e5">20xx</text>
