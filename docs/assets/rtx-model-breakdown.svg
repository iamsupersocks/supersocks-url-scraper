    <circle cx="1380" cy="70" r="8" fill="#ff7bbd"/><text x="1398" y="76" fill="#d5d1e5">50xx</text>
  </g>
  <text x="55" y="142" fill="#aaa7bb" font-family="Inter,Arial,sans-serif" font-size="17">Chaque ligne = modèle · la barre = médiane · n = nombre d'annonces GPU</text>
