  <text class="bar-label" x="40" y="444">Platinum Secret Rare</text>
  <rect class="bar" x="360" y="430" width="14.9" height="20" rx="4"/>
  <text class="value" x="391" y="445">2 € · n=3</text>
  <text class="bar-label" x="40" y="484">Common</text>
