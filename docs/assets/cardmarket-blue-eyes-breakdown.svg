<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" role="img" aria-labelledby="be-title be-desc">
  <style>
    .title,.bar-label,.value{font-family:IBM Plex Sans,Segoe UI,sans-serif}
    .title{font-weight:650;fill:#102a43}
    .subtitle,.axis{fill:#486581;font-family:IBM Plex Sans,Segoe UI,sans-serif}
    .bar{fill:#0b6e4f}
    .bar-label,.value{fill:#243b53;font-size:15px}
    .axis{font-size:14px}
  </style>
  <title id="be-title">Cardmarket Blue-Eyes version floor medians by rarity</title>
  <desc id="be-desc">Median From-price in EUR for Blue-Eyes White Dragon product versions on Cardmarket, grouped by parsed rarity. Unknown rarity excluded.</desc>
  <rect width="1320" height="560" fill="#f0f4f8"/>
  <text class="title" x="40" y="44" font-size="26">Blue-Eyes · version floor medians by rarity</text>
  <text class="subtitle" x="40" y="72" font-size="15">Cardmarket public Versions page · From-prices only · 2026-08-04 20:44 CEST</text>
  <text class="subtitle" x="40" y="94" font-size="15">n excludes unknown rarity · median From (€) by parsed rarity</text>
  <text class="axis" x="360" y="128">Median From-price (€)</text>
  <!-- Scale: max median 69.99 € → max bar width 520; values sit to the right with ≥180px canvas margin -->
  <text class="bar-label" x="40" y="164">Starlight Rare</text>
  <rect class="bar" x="360" y="150" width="520.0" height="20" rx="4"/>
  <text class="value" x="896" y="165">69.99 € · n=3</text>
  <text class="bar-label" x="40" y="204">Ultimate Rare</text>
  <rect class="bar" x="360" y="190" width="369.6" height="20" rx="4"/>
  <text class="value" x="746" y="205">49.725 € · n=2</text>
  <text class="bar-label" x="40" y="244">Quarter Century Secret Rare</text>
  <rect class="bar" x="360" y="230" width="297.2" height="20" rx="4"/>
  <text class="value" x="673" y="245">40 € · n=13</text>
  <text class="bar-label" x="40" y="284">Rare</text>
  <rect class="bar" x="360" y="270" width="89.2" height="20" rx="4"/>
  <text class="value" x="465" y="285">12 € · n=11</text>
  <text class="bar-label" x="40" y="324">Secret Rare</text>
  <rect class="bar" x="360" y="310" width="58.5" height="20" rx="4"/>
  <text class="value" x="434" y="325">7.875 € · n=16</text>
  <text class="bar-label" x="40" y="364">Super Rare</text>
  <rect class="bar" x="360" y="350" width="50.1" height="20" rx="4"/>
  <text class="value" x="426" y="365">6.75 € · n=2</text>
  <text class="bar-label" x="40" y="404">Ultra Rare</text>
